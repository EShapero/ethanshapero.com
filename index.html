the redesign","ratio":"3:2"}]}},{"slug":"ares","title":"ARES: EpiPen Delivery Drone","short":"ARES","brief":"A racing drone rebuilt to parachute an EpiPen to whoever needs it.","tier":"featured","rank":3,"year":"2025","role":"Solo designer and builder","status":"Paused until I can test on a proper flight range","hook":"I’ve carried an EpiPen my whole life. So I turned my racing drone into one that flies to a GPS point and parachutes an EpiPen down to whoever needs it.","story":"ARES (Aerial Rapid Emergency Supply) is built on the 5-inch carbon-fiber racing quad I made with a friend. I moved it from Betaflight to INAV firmware for GPS waypoint flight and designed a 3D-printed drop mechanism, fired by micro servos, that lets the payload down under a parachute; it took more than four versions before the chute opened reliably. The goal is 2 miles in under 2 minutes, and the fastest measured run so far was just under 100 mph [tbc]. It’s paused because flying a 100 mph autonomous drone near people needs a real test range.","stats":[{"value":"2 mi","label":"target range, in under 2 minutes","short":"target range"},{"value":"4+","label":"drop-mechanism versions before the parachute opened reliably","short":"drop designs"},{"value":"v6","label":"current version, the 2nd that works end to end","short":"latest build"}],"skills":["Drone building & piloting","Flight controllers (Betaflight, INAV)","GPS navigation","Mechanism design","3D printing","Soldering"],"specs":[{"k":"Frame","v":"5-inch carbon fiber, 6S (25 V), analog FPV"},{"k":"Navigation","v":"GPS waypoints on INAV (moved from Betaflight)"},{"k":"Radio","v":"ExpressLRS"},{"k":"Drop","v":"3D-printed ABS latch, micro servos, self-deploying parachute"},{"k":"Payload","v":"An EpiPen; it is also meant to carry Narcan or fast-acting glucose"},{"k":"Top speed","v":"Just under 100 mph, measured [tbc]"},{"k":"Target mission","v":"2 miles, drop from ~200 ft, under 2 minutes"}],"links":[],"media":{"hero":{"kind":"photo","label":"Photo: red parachute carrying the payload down, drone hovering above","ratio":"3:4"},"gallery":[{"label":"Photo: ARES with its orange payload pod, resting on a field pack","ratio":"3:4"},{"label":"Photo: drop mechanism, green printed release arms under the quad, held in hand","ratio":"3:4"},{"label":"Video: slow-motion drop, chute opening [tbc]","ratio":"16:9"},{"label":"Video: FPV flight from the drone’s camera [tbc]","ratio":"16:9"}]}},{"slug":"space-launch","title":"Space Launch: High-Altitude Balloon","short":"Space Launch","brief":"A sensor payload my team flew into the stratosphere on a balloon.","tier":"featured","rank":2,"year":"2026","role":"Project lead · five-person team · Applied Science Research","status":"Flown and recovered, Mar 2026 · 62-page paper","hook":"A box of sensors my five-person team built and sent up on a weather balloon to measure the atmosphere. It reached 100,126 feet. I was project lead.","story":"We built it for our Applied Science Research class, to measure how pressure, temperature, humidity and radiation change with altitude. Everything sat on a 3D-printed, three-level rack inside a foam box: an Arduino running the flight, a Teensy logging a backup copy to its own SD card, a heater, a GoPro, a radio sending data down as RTTY, and a cutdown that burns through the balloon line with nichrome wire powered by ultracapacitors. The balloon carried it to 100,126 feet. But the calibration values never made it into the code we flew, so the payload thought it was far lower than it was. The cutdown never fired, the parachute never opened, and the box fell all the way down and hit the ground at about 40 mph. An AirTag led us to it, the data from both loggers survived, and we corrected it and wrote it up in a 62-page paper [tbc].","stats":[{"value":"100,126 ft","label":"peak altitude, by GPS","short":"peak altitude"},{"value":"−64°C","label":"coldest air outside, near the tropopause","short":"coldest air"},{"value":"3.7 lb","label":"payload weight, under the FAA’s 4 lb limit","short":"payload weight"}],"skills":["Team leadership","Sensor integration & calibration","Embedded C/C++","Radio links & telemetry","Fusion 360 CAD","3D printing","Soldering","Technical writing"],"specs":[{"k":"Altitude","v":"100,126 ft (30.5 km) by GPS, 1.6% above the forecast"},{"k":"Payload","v":"3.7 lb foam box with a 3D-printed three-level rack · GoPro on the bottom"},{"k":"Brain","v":"Arduino Uno R4 WiFi runs the flight · Teensy 3.5 logs a backup to its own SD card"},{"k":"Sensors","v":"Analog pressure, MS5611 and BME680, inside and outside thermistors, GPS, Radiacode 103 radiation detector [tbc]"},{"k":"Telemetry","v":"RTTY at 45 baud from a 100 mW transmitter, decoded in Fldigi and heard over 80 miles away"},{"k":"Tracking","v":"APRS GPS tracker, a radio beacon and a Yagi antenna we built from tape measure · an AirTag found it"},{"k":"Cutdown","v":"Nichrome wire fired by 3 ultracapacitors through a MOSFET"},{"k":"Heater","v":"Heating pad switched on below 10°F and off at 15°F"},{"k":"Results","v":"Coldest air outside −64°C near the tropopause · radiation peaked near 80,000 ft · lowest pressure 9.7 mbar"},{"k":"What went wrong","v":"The flight code was missing its calibration values, so the cutdown never fired and the payload fell freely, landing at about 40 mph"}],"links":[{"label":"Read the paper (PDF, 62 pages)","url":"papers/space-launch-paper.pdf"}],"media":{"hero":{"kind":"photo","label":"Photo: the curve of the Earth under a black sky, from the payload’s GoPro near peak altitude","ratio":"9:16"},"gallery":[{"label":"Photo: the filled balloon over the payload box and red parachute at our tethered test launch at school [tbc] [tbc]","ratio":"3:4"},{"label":"Photo: looking down into the foam box, the rack lit teal by an LED","ratio":"3:4"},{"label":"Photo: the three-level rack on the bench: cutdown capacitors on top, Arduino and buzzer in the middle, batteries below","ratio":"3:4"},{"label":"Photo: the payload box cracked open after the free-fall landing [tbc]","ratio":"3:4"},{"label":"Video: GoPro footage near peak altitude, the Earth’s curve below the box [tbc]","ratio":"9:16"},{"label":"Video: the release at launch, balloon and payload climbing away [tbc] [tbc]","ratio":"9:16"}]}},{"slug":"solar-lights","title":"Solar Lights for Tanzania","short":"Solar Lights","brief":"Motion-activated solar lights I designed for a school in rural Tanzania.","tier":"featured","rank":6,"year":"2024–26","role":"Designer · with TunzaAfrica (Student Ambassador)","status":"Built and tested · install planned May 2027","hook":"The donated lights in a Tanzanian school’s bathrooms and dorms broke almost right away. I designed a palm-sized, motion-activated solar light to replace them.","story":"During a 10-day homestay at a rural school in northern Tanzania, I learned the power grid there is unreliable, and the school had about two hours of battery-backed light a night. Working with the local NGO TunzaAfrica, I designed a light that charges in the sun and only turns on at night when its PIR sensor sees motion. The 3D-printed case fits in your palm and doubles as a power bank. After feedback from TunzaAfrica staff and students, the final version is about 10x smaller and 2x brighter than the lights it replaces, and the next Menlo Abroad group plans to install them in May 2027.","stats":[{"value":"10x","label":"smaller than the donated lights","short":"smaller"},{"value":"2x","label":"brighter","short":"brighter"},{"value":"~1 wk","label":"of use on one charge","short":"per charge"}],"skills":["Low-power circuits","Solar power systems","Sensor integration & calibration","3D printing","User research"],"specs":[{"k":"Sensor","v":"PIR motion, night-only activation"},{"k":"Case","v":"Palm-sized 3D-printed ABS, doubles as a power bank"},{"k":"Power","v":"Solar charging, rechargeable battery pack"},{"k":"Units built","v":"[tbc]"},{"k":"Partner","v":"TunzaAfrica (Tanzania)"},{"k":"Site","v":"A rural school in northern Tanzania"},{"k":"Also","v":"Helping set up a U.S. nonprofit affiliate of TunzaAfrica (in progress)"}],"links":[{"label":"TunzaAfrica","url":"https://tunzaafrica.org"}],"media":{"hero":{"kind":"photo","label":"Photo: finished light in hand, brown printed case with PIR dome and LED","ratio":"3:4"},"gallery":[{"label":"Photo: inside the case, battery pack and control board","ratio":"3:4"},{"label":"Photo: breadboard prototype with PIR sensor, battery and LED","ratio":"3:4"},{"label":"Photo: the light glowing at night [tbc]","ratio":"4:3"},{"label":"Photo: the school in northern Tanzania [tbc]","ratio":"16:9"}]}},{"slug":"go-kart","title":"Electric Formula Go-Kart","short":"Go-Kart","brief":"A Formula-style electric go-kart built by the engineering club I co-founded.","tier":"featured","rank":4,"year":"2025–26 [tbc]","role":"Co-founder & co-lead, Menlo Engineering Club · chassis, CAD, electrical","status":"Built and running · driven at low speed, never on a track or at full speed","hook":"I co-founded my school’s engineering club so people with zero experience could build something real. Our first build is a welded, electric, Formula-style go-kart designed to top 50 mph.","story":"At the start of junior year, three friends and I founded the Menlo Engineering Club around one project, and about 20 students [tbc] built it over nine months. I did all the CAD, welded the box-steel frame and worked on the brakes, the steering and the high-voltage electronics. I also ran workshops so members with no experience could learn to weld and design circuits. We found an outside sponsor, and I got the lab’s approval for high-power motors. The kart runs and we’ve driven it, but school safety rules have kept it at low speed and off a track, so its 50-plus mph top speed is still a design number.","stats":[{"value":"~9 mo","label":"of building, from bare steel to a running kart","short":"to build"},{"value":"10 hr","label":"print time for each 3D-printed dashboard control panel","short":"per dashboard panel"},{"value":"4","label":"co-founders, me and three friends","short":"co-founders"}],"skills":["Welding","Fusion 360 CAD","High-voltage / high-current power","Team leadership","Fundraising & sponsorship","Teaching & curriculum"],"specs":[{"k":"Frame","v":"Welded box steel"},{"k":"Motor","v":"[tbc] BLDC"},{"k":"Drive","v":"Chain and sprocket, disc brake, 4-battery pack"},{"k":"Design speed","v":"50+ mph [tbc]"},{"k":"Team","v":"[tbc]"},{"k":"Funding","v":"Outside sponsor"},{"k":"My part","v":"All CAD, frame, brakes, steering, high-voltage electronics, workshops"}],"links":[],"media":{"hero":{"kind":"photo","label":"Photo: kart in the Menlo lab, red seat and fat ATV tires","ratio":"4:3"},"gallery":[{"label":"Photo: rear view, motor controller and wiring on the welded frame","ratio":"4:3"},{"label":"Render + photo: full CAD in Menlo livery beside the bare welded chassis","ratio":"16:9"},{"label":"Video: the kart moving [tbc]","ratio":"16:9"},{"label":"Photo: club build day, hands and tools [tbc]","ratio":"3:2"}]}},{"slug":"arm-prototype","title":"Robotic Arm Prototype","short":"Arm Prototype","brief":"A solo-built 3-foot arm, designed to grab drones, that started the Jukebox.","tier":"main","rank":8,"year":"2026","role":"Solo · Applied Science Research capstone","status":"Bench-tested · became the full-size Jukebox","hook":"The arm before the Jukebox: a 3-foot robot I built alone, designed to find a drone by radio ranging and grab it with an electromagnet.","story":"A few days after I first met the Seeing Systems founders, I chose their problem, getting drones back onto a moving boat, as my research capstone, and started an arm far bigger than the 5-servo desk arm I’d built before. It’s 3 feet long with 5 joints, designed to find a drone by radio ranging and grab it with an electromagnet. It was only half-built when I brought it to our second meeting. I wrote about 3,000 lines of firmware and a browser control panel with a live 3D view and bench-tested it [tbc]. It grew into the full-size Jukebox.","stats":[{"value":"3 ft","label":"long, with 5 joints","short":"long"},{"value":"~3,000","label":"lines of firmware I wrote","short":"lines of firmware"},{"value":"~10 cm","label":"radio tracking accuracy, 10 times a second","short":"tracking accuracy"}],"skills":["Mechanism design","3D printing","Embedded C/C++","Kinematics","Motor control","Sensor integration & calibration","Radio links & telemetry","Web development"],"specs":[{"k":"Joints","v":"5: base, shoulder, elbow, wrist roll, wrist pitch"},{"k":"Reach","v":"30+ in (about 3 ft)"},{"k":"Brain","v":"Teensy 4.1, ~3,000 lines of C++ in 18 files"},{"k":"Motors","v":"3 brushed gearmotors with potentiometer feedback on BTS7960 drivers, 2 wrist servos"},{"k":"Tracking","v":"UWB radio ranging: 3 anchors on the boat, 1 on the arm tip, a tag on the drone; ~10 Hz, ~10 cm"},{"k":"Deck tilt","v":"BNO085 IMU"},{"k":"Grip","v":"Electromagnet onto a steel plate on the drone"},{"k":"Control","v":"Browser control panel (~2,400 lines) with a live Three.js 3D view and a simulated-drone mode"},{"k":"Debugging","v":"An elbow sensor dead zone, a dead Teensy pin, and radio modules silenced by bad jumper contacts"},{"k":"Tested","v":"On the bench [tbc]"}],"links":[],"leadsTo":[{"slug":"jukebox"}],"media":{"hero":{"kind":"photo","label":"Photo: probably the 3-foot prototype [tbc]","ratio":"4:5"},"gallery":[{"label":"Video: performance demo, Apr 26, 2026 [tbc]","ratio":"16:9"},{"label":"Video: control panel and tech walkthrough, Apr 26, 2026 [tbc]","ratio":"16:9"}]}},{"slug":"teaching","title":"Robotics Class for Kids","short":"Teaching","brief":"A robotics class I’ve taught 5-to-7-year-olds every week since 2023.","tier":"main","rank":9,"year":"2023–now","role":"Founder and teacher · weekly paid class, ages 5–7","status":"Ongoing · ~2 hours a week","hook":"A neighbor wanted a high schooler to teach his son and his friends engineering. I said yes, and almost three years later it’s a weekly class with lessons I write myself.","story":"In the winter of my freshman year, Tucker’s dad asked for a high schooler to teach his son and his friends engineering, and I said yes right away. The first classes were chaos until I split the kids into two groups by what they wanted to build, and they started teaching each other. I write every lesson: motors wound from magnet wire and nails, laser tripwires, LEGO robots, hovercrafts, drones, and RC planes and boats. Our 3D-printed RC plane only flew for a few seconds the first time, so we rebuilt it. Right now we’re working toward a model-rocket launch, starting with engine tests that measure burn time and thrust.","stats":[{"value":"6","label":"students at its largest","short":"students"},{"value":"5–7","label":"age range","short":"age range"},{"value":"~3 yrs","label":"of weekly classes","short":"of weekly classes"}],"skills":["Teaching & curriculum","RC aircraft","3D printing"],"specs":[{"k":"Schedule","v":"Weekly, ~2 hours"},{"k":"Units","v":"Wound motors, laser tripwires, LEGO robots, hovercrafts, drones, RC planes and boats, vacuum robots, model rockets"},{"k":"Method","v":"Two groups by interest, so the kids teach each other"},{"k":"Tools","v":"LEGO Mindstorms EV3, 3D printer"}],"links":[],"media":{"hero":{"kind":"photo","label":"Photo: foam-board craft with a center fan, built with the class","ratio":"3:4"},"gallery":[{"label":"Photo: Prusa MK4 printing yellow RC-plane airframe parts","ratio":"4:3"},{"label":"Photo: a build session, hands and builds only [tbc]","ratio":"16:9"},{"label":"Video: model-rocket engine test [tbc]","ratio":"16:9"}]}},{"slug":"greenhouse","title":"Greenhouse Automation System","short":"Greenhouse","brief":"A solar-powered controller built to run my school’s greenhouse by itself.","tier":"main","rank":10,"year":"2025–26","role":"Solo design and build · Applied Science Research","status":"Built and tested · [tbc]","hook":"A solar-powered controller for my school’s new greenhouse. It reads 14 sensors and is built to run the irrigation and climate on its own.","story":"My Applied Science Research teacher challenged me to skip the standard assignment and automate the school’s new greenhouse, fully on solar. An Arduino GIGA R1 with a touchscreen compares soil-moisture, CO₂, pH and humidity readings against setpoints, then switches 8 relays for three drip-irrigation zones, a mister, a vent, a motorized window and two soil heaters. Two 400 W panels feed a 3,500 W inverter and LiFePO₄ batteries, so it can keep running through days with little sun. The touchscreen interface is over 1,000 lines of code, which I wrote with help from AI.","stats":[{"value":"14","label":"sensors, soil probes in 3 zones","short":"sensors"},{"value":"800 W","label":"of solar panels","short":"solar panels"},{"value":"1,000+","label":"lines of interface code","short":"lines of code"}],"skills":["Embedded C/C++","Sensor integration & calibration","Solar power systems","High-voltage / high-current power","Laser cutting","Waterproofing"],"specs":[{"k":"Controller","v":"Arduino GIGA R1 + 4-inch touchscreen"},{"k":"Sensors","v":"10 soil moisture, 2 humidity/temperature, CO₂, soil pH"},{"k":"Outputs","v":"3 drip circuits, mister, vent, auto window, 2 soil heaters"},{"k":"Power","v":"2 × 400 W solar, 3,500 W inverter/charger, LiFePO₄ batteries"},{"k":"Controls","v":"4 switches, 4 slide pots, touchscreen menus"}],"links":[{"label":"Read the paper (PDF, 29 pages)","url":"papers/greenhouse-great-wall-paper.pdf"}],"media":{"hero":{"kind":"photo","label":"Photo: control box showing its status screen beside a seedling with a soil probe","ratio":"4:3"},"gallery":[{"label":"Photo: inside the enclosure, relay board and wiring, “Menlo Greenhouse Automation System” label","ratio":"4:3"},{"label":"Photo: bench prototype, Arduino and sensors wired to a laptop","ratio":"4:3"},{"label":"Photo: solar panels and battery bank at the greenhouse [tbc]","ratio":"16:9"},{"label":"Photo: system installed in the greenhouse [tbc]","ratio":"16:9"}]}},{"slug":"asr-motor","title":"Hand-Built DC Motor","short":"DC Motor","brief":"A motor we built from scratch, 3rd all-time in running torque.","tier":"featured","rank":5,"year":"2025","role":"Co-designer with my classmate Sam · Applied Science Research","status":"Complete · Menlo ASR Hall of Fame","hook":"Build an electric motor from scratch, every part, and compete in one category. We picked running torque, and ours placed 3rd in the program’s history.","story":"Every year, 20 to 30 students in Menlo’s Applied Science Research class build a motor from scratch and compete in one category. Sam and I were the only juniors in a class of seniors, and we picked running torque. We had the first motor in the class spinning in four days, then went through four design generations, ending at a 6-pole, 12-phase motor with six hand-wound electromagnets and a 12-panel copper commutator we cut and epoxied by hand. It finished 3rd all-time in torque and, to our surprise, 6th in efficiency, which put us in the ASR Hall of Fame.","stats":[{"value":"0.29 N·m","label":"running torque, 3rd all-time","short":"running torque"},{"value":"6th","label":"all-time in efficiency","short":"all-time efficiency"},{"value":"4 days","label":"to the first motor spinning in the class","short":"to first spin"}],"skills":["Motor design","Fusion 360 CAD","3D printing","Technical writing"],"specs":[{"k":"Layout","v":"6-pole, 12-phase brushed DC"},{"k":"Magnets","v":"6 × N52 neodymium"},{"k":"Coils","v":"6 hand-wound electromagnets, 24-gauge copper on steel cores"},{"k":"Commutator","v":"12 hand-cut copper panels, epoxy-sealed and sanded flat"},{"k":"Brushes","v":"Spring-loaded graphite"},{"k":"Speed","v":"1,124 RPM"},{"k":"Efficiency","v":"8.44% [tbc]"},{"k":"Program history","v":"[tbc]"}],"links":[{"label":"Read the paper (PDF, 10 pages)","url":"papers/asr-motor-paper.pdf"}],"media":{"hero":{"kind":"photo","label":"Photo: final motor on its test stand beside our labeled starter box","ratio":"16:9"},"gallery":[{"label":"Photo: prototype #2 on the lab bench, copper commutator and wound coils","ratio":"3:4"},{"label":"Render: final motor CAD, six red coils around the rotor","ratio":"3:4"},{"label":"Video: motor spinning with an rpm readout [tbc]","ratio":"16:9"}]}},{"slug":"aerial-aquatic","title":"Aerial-Aquatic Drone","short":"Air-Water Drone","brief":"A drone designed to fly, then dive and keep going underwater.","tier":"main","rank":11,"year":"2025–26","role":"Solo","status":"Dives about 10 ft · doesn’t fly yet [tbc]","hook":"A drone meant to fly, drop into the water and keep going underneath, staying in radio contact through a floating buoy on a tether.","story":"After seeing research robots that both fly and swim [tbc], I started CAD the same day and built eight different test devices in two weeks. The drone carries four motors for flight and four thrusters for water, and a relay picks which set of speed controllers gets power. Radio barely gets through water, so a buoy deploys on a data-carrying tether, and a motorized reel lets out or pulls in line as the depth changes. The current prototype dives about 10 feet and runs for about 15 minutes, but it doesn’t fly yet [tbc].","stats":[{"value":"~10 ft","label":"dive depth so far","short":"dive depth"},{"value":"8","label":"motors: 4 for air, 4 for water","short":"motors"},{"value":"~15 min","label":"combined run time","short":"run time"}],"skills":["Drone building & piloting","Marine propulsion","Waterproofing","Mechanism design","Radio links & telemetry","Flight controllers (Betaflight, INAV)","Fusion 360 CAD"],"specs":[{"k":"Propulsion","v":"4 flight motors + 4 underwater thrusters, relay-switched ESCs"},{"k":"Comms","v":"Tethered surface buoy, ELRS radio"},{"k":"Tether","v":"Motorized reel, tension set by depth"},{"k":"Firmware","v":"Betaflight"}],"links":[],"media":{"hero":{"kind":"photo","label":"Photo: printed frame with red motor mounts and coiled tether","ratio":"4:3"},"gallery":[{"label":"Render: ducted air props above, green water thrusters below","ratio":"10:7"},{"label":"Photo + render: ducted prototype on a window seat beside its CAD","ratio":"13:7"},{"label":"Video: pool dive with the buoy deployed [tbc]","ratio":"16:9"}]}},{"slug":"walnut-works","title":"The Walnut Works","short":"Walnut Works","brief":"My woodworking business at 14: resin-inlay boards, $5,000+ in sales.","tier":"main","rank":12,"year":"2023–24","role":"Founder · design, build and sales","status":"Closed · profits became shop tools","hook":"At 14 I started a woodworking business selling resin-inlay cutting boards. It brought in $5,000+, and almost all of it went into tools for my later projects.","story":"From 14 to 15 I taught myself CNC routing, finishing and how to choose wood, then sold through my own website and to people nearby. I made 20+ cutting boards, 5 charcuterie boards and 2 desks, including the desk I still use every day.","stats":[{"value":"$5,000+","label":"revenue","short":"in sales"},{"value":"20+","label":"customers","short":"customers"},{"value":"27+","label":"boards and desks built","short":"boards and desks"}],"skills":["Woodworking","CNC machining","Resin casting","Small business"],"specs":[{"k":"Made","v":"20+ cutting boards, 5 charcuterie boards, 2 desks"},{"k":"Sales","v":"My own website and local customers"}],"links":[],"media":{"hero":{"kind":"photo","label":"Photo: walnut live-edge desk with a green resin river","ratio":"16:9"},"gallery":[{"label":"Photo: four finished boards with resin-inlay letters and numbers","ratio":"6:5"},{"label":"Photo: router on the CNC machine cutting a board","ratio":"3:4"}]}},{"slug":"kayak","title":"Motorized Kayak","short":"Kayak","brief":"An electric kayak with a 3,000-watt underwater thruster that does 8 mph.","tier":"featured","rank":7,"year":"2024","role":"Solo build (v2) · v1 with my cousins","status":"Runs at 8 mph · steering fixed in 2026 [tbc]","hook":"A kayak with a 3,000-watt underwater thruster, joystick steering and an Arduino control box. It does 8 mph.","story":"Version one, built with my cousins, locked two kayaks together with a PVC frame so four of us could ride one boat, moved by a mechanical paddle system between the hulls. For version two I wanted three underwater thrusters so the boat would run fully on its own power, and I built all of it myself. The motor bracket snapped twice, so I built it three times, and in the end a 3,000 W thruster on an 8-inch prop pushed it to 8 mph, with my old underwater-scooter motors as side thrusters for steering. Once it went fast I left the steering barely working and moved on, until I came back to it this fall and fixed it [tbc].","stats":[{"value":"2","label":"motor brackets snapped before the third one held","short":"motor brackets snapped"},{"value":"4","label":"riders on version one, two kayaks locked into one boat","short":"riders in v1"},{"value":"2","label":"control boxes: throttle, GPS speed, current and voltage, joystick, battery cutoffs","short":"control boxes"}],"skills":["High-voltage / high-current power","Embedded C/C++","Marine propulsion","Waterproofing"],"specs":[{"k":"Goal","v":"Three underwater thrusters, fully self-powered"},{"k":"Thrust","v":"3,000 W underwater thruster, 8-inch prop"},{"k":"Steering","v":"Side thrusters from my underwater scooter, joystick"},{"k":"Bracket","v":"Built three times; the first two snapped"},{"k":"Dashboard","v":"Throttle, GPS speed and distance, current and voltage, battery cutoffs"},{"k":"Brain","v":"Arduino in a waterproof rear enclosure"}],"links":[],"media":{"hero":{"kind":"photo","label":"Photo: driving the kayak across a lake at golden hour","ratio":"13:7"},"gallery":[{"label":"Photo: kayak in the garage with PVC frame, thrusters and open control box","ratio":"4:3"},{"label":"Photo: top-down, red frame with side steering thrusters","ratio":"3:4"},{"label":"Video: on the water at speed [tbc]","ratio":"16:9"}]}},{"slug":"rc-launcher","title":"RC Plane Launcher","short":"Plane Launcher","brief":"A supercapacitor rail launcher that throws an RC glider at 60 ft/s.","tier":"main","rank":13,"year":"[tbc]","role":"Solo · sophomore Mechanical/Electrical Engineering final","status":"Complete · now I TA the class","hook":"A rail launcher that throws an RC glider off at 60 feet per second, powered by 16 supercapacitors and a 1,000 W motor.","story":"A cart rides a rail, pulled by a string wound onto the motor, and the supercapacitor bank lets the motor put out full power all at once. When the cart reaches the end of the rail it trips a switch that brakes the motor, so the glider leaves with almost no speed lost and flies over 100 feet. I’m now the TA for the class I built it in.","stats":[{"value":"60 ft/s","label":"launch speed","short":"launch speed"},{"value":"100+ ft","label":"flight distance","short":"flights"},{"value":"16","label":"supercapacitors","short":"supercapacitors"}],"skills":["High-voltage / high-current power","Mechanism design","RC aircraft","Soldering"],"specs":[{"k":"Motor","v":"1,000 W"},{"k":"Energy","v":"16 supercapacitors"},{"k":"Brake","v":"Automatic, end-of-rail switch"}],"links":[],"media":{"hero":{"kind":"photo","label":"Photo: launcher rail on the campus lawn with the capacitor box","ratio":"4:3"},"gallery":[{"label":"Photo: glider in the air over the lawn just after launch","ratio":"16:9"},{"label":"Photo: rail and wiring on sawhorses in the lab","ratio":"3:4"},{"label":"Video: slow-motion launch [tbc]","ratio":"16:9"}]}},{"slug":"floating-table","title":"Floating Tensegrity Table","short":"Floating Table","brief":"A table that looks like it floats, held together by steel cables.","tier":"also","rank":14,"year":"2024","role":"Built with a classmate · 10th-grade Mechanical/Electrical Engineering class","status":"Complete","hook":"A tensegrity table, the kind that looks like it floats: plywood and welded steel, held together only by steel cables in tension. We tested it to 150 lb.","stor
