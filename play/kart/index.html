<body class="ready">
<header class="top">
  <a class="back" href="../">&larr; Games</a>
  <h1>Kart Run</h1>
  <a class="site" href="/">ethanshapero.com</a>
</header>
<main>
  <div class="band" id="band">
    <canvas id="c" role="img" aria-label="Kart Run: an electric go-kart on a track lined with robotic arms, with interceptor drones overhead"></canvas>
    <div class="hud" aria-hidden="true"><span id="hi"></span><span class="dist" id="dist"><b id="m">0</b> m</span></div>
    <button class="pz" id="pz" type="button" aria-label="Pause" title="Pause (P)"><svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="2.6" height="10" rx="1"/><rect x="8.4" y="2" width="2.6" height="10" rx="1"/></svg></button>
    <div class="lb" id="lb">
      <div class="lb-ask" id="lb-ask" hidden>
        <p class="lb-k" id="lb-ask-h"><b>New world high score.</b> Enter your initials.</p>
        <div class="lb-row">
          <label class="ini"><input id="ini" type="text" maxlength="3" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your initials, three letters" aria-describedby="lb-ask-h"><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i></label>
          <button class="lb-go" id="lb-go" type="button">Submit</button>
          <button class="lb-x" id="lb-x" type="button">Skip</button>
        </div>
      </div>
      <div class="lb-top" id="lb-top" hidden><p class="lb-k">World top 10</p><ol id="lb-ol"></ol></div>
      <p class="lb-m" id="lb-m" role="status" hidden></p>
    </div>
  </div>
  <section class="msg" id="msg" aria-live="polite">
    <p class="lead" id="lead"></p>
    <p class="sub" id="sub"></p>
    <button class="go" id="go" type="button"></button>
    <p class="keys" id="keys"></p>
  </section>
  <div class="pad" id="pad" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg><b>Hold to duck</b><span>or swipe down anywhere</span></div>
</main>
<script>
/* Kart Run. Spacing is compacted to keep the file under 35 KB; the logic reads top to bottom */
(()=>{
'use strict';
const $=(i)=>document.getElementById(i);
const B=document.body,band=$('band'),cv=$('c'),g=cv.getContext('2d');
const pzEl=$('pz'),hiEl=$('hi'),mEl=$('m'),distEl=$('dist'),msgEl=$('msg'),leadEl=$('lead'),subEl=$('sub'),goEl=$('go'),keysEl=$('keys'),padEl=$('pad');
const rmq=matchMedia('(prefers-reduced-motion: reduce)'),rm=()=>rmq.matches;
let touch=matchMedia('(pointer: coarse)').matches;
const STEP=1/60,TAU=Math.PI*2,D=Math.PI/180,UNIT=40,LAP=700;
const V0=700,GU=2200,GD=2700,MINH=36,VCUT=400;
const clamp=(v,a,b)=>(v<a?a:v>b?b:v),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const sm=(t)=>(t=clamp(t,0,1),t*t*(3-2*t));
const hash=(n)=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const fmt=(n)=>Math.floor(n).toLocaleString('en-US');
const store={
get(){try{return+localStorage.getItem('kartRunBest')||0;}catch(e){return 0;}},
set(v){try{localStorage.setItem('kartRunBest',String(v));}catch(e){}}
};
const T=window.__kart={god:false,ff:1,perf:[]};
/* laps: day, dusk, night, dawn, all from the site's greys and its one green */
const hex=(h)=>[1,3,5].map((i)=>parseInt(h.slice(i,i+2),16));
const PK=['skyT','skyB','ridge','hills','mid','grd','gl','tex'];
const PAL=[
['#0E100E','#1A1D1A','#1D211D','#232723','#2E322E','#0C0D0C','#7A7F77','#2E322E',0,0,0,.1,0],
['#0B0D0C','#17231C','#18211B','#1C251F','#28302A','#0A0C0B','#6A726A','#29302A',1,.3,0,.55,1],
['#050605','#0C0F0D','#0F120F','#131713','#1E221E','#070807','#50564F','#1E221E',.25,1,1,1,0],
['#0C0E0E','#1C2520','#1A211C','#1E2621','#2A312B','#0A0C0B','#6F766E','#2C322C',.8,.35,.25,.45,1]
].map((r)=>{const o={};PK.forEach((k,i)=>(o[k]=hex(r[i])));[o.glow,o.star,o.moon,o.lamp,o.sun]=r.slice(8);return o;});
const NAMES=['Day','Dusk','Night','Dawn'];
const palette=(p)=>{
const i=Math.floor(p),f=p-i,a=PAL[i%4],b=PAL[(i+1)%4],o={};
for(const k in a)o[k]=Array.isArray(a[k])?a[k].map((v,j)=>v+(b[k][j]-v)*f):a[k]+(b[k]-a[k])*f;
return o;
};
const css=(c,al=1)=>`rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${al})`;
const phaseOf=(mm)=>{const L=Math.floor(mm/LAP);return L?L-1+sm((mm-L*LAP)/90):0;};
let P=PAL[0],pp=0;
const C={
fg:'#E9EAE5',fg2:'#A9ADA6',dk:'#1A1C1A',dk2:'#2A2D2A',ol:'#484C46',suit:'#90958D',leg:'#767B73',
or:'#DC7B4E',wh:'#E7E8E3',sil:'#B9BDB5',sil2:'#8A8F87',gr:'#4FC08A'
};
/* layout: the world is 300 to 700 units wide, whatever the band's pixel size */
let W=700,H=210,GY=165,s=1,dpr=1,kx=50,vmin=400,vmax=860,padTop=Infinity,rk=1,hz=740;
let kj=1,v0=V0,gu=GU,gd=GD,vcut=VCUT;
function resize(){
const r=band.getBoundingClientRect();
dpr=Math.min(devicePixelRatio||1,3);
cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
W=clamp(Math.min(r.width*.35+344,r.width*.82),300,700);s=r.width/W;H=r.height/s;
GY=H-clamp(H*.2,38,60);kx=clamp(W*.07,16,50);rk=clamp(GY/150,1,1.5);
const sp=clamp((W-300)/400,0,1);
vmin=lerp(340,400,sp);vmax=lerp(620,860,sp);
kj=lerp(.9,1,sp);v0=V0*kj;gu=GU*kj*kj;gd=GD*kj*kj;vcut=VCUT*kj;
const pr=padEl.getBoundingClientRect();padTop=pr.height?pr.top-8:Infinity;
draw(1);
}
/* state */
let state='ready',cam=0,pcam=0,dist=0,runT=0,v=0,m=0,best=store.get();
let ky=0,pky=0,vy=0,air=false,cut=false,holdJ=false,jbuf=0;
let duckK=false,duckP=0,duckS=0,duck=false,duckT=0;
let susp=0,suspV=0,pitch=0,wr=0,wf=0,dustAcc=0;
let obs=[],fx=[],nextAt=0,hist=[],lastH=0,lap=0,clock=0,shake=0,overAt=0,flashAt=-9,lastPrimary=0;
const stars=Array.from({length:80},(_,i)=>[hash(i+.1)*2000,hash(i+.2)*.85,.35+hash(i+.3)*.8,hash(i+.4)*TAU]);
/* obstacles */
const KIN={p:{l:[16,14,5],a:[76,-62,-48]},t:{l:[17,15,5],a:[84,-18,-55]}};
function make(type,x){
const A=(k,dx,sc,f)=>({k,dx,sc,f,ph:rnd(0,TAU)});
let parts,w;
switch(type){
case 'p':{const sc=rnd(.86,1);parts=[A('p',22*sc,sc,-1)];w=35*sc;break;}
case 't':parts=[A('t',21,1,-1)];w=34;break;
case 'p2':parts=[A('p',21,.92,-1),A('p',45,.86,1)];w=66;break;
case 'p3':parts=[A('p',20,.88,-1),A('t',43,.9,-1),A('p',64,.8,1)];w=82;break;
case 'j':parts=[A('j',19,.92,1)];w=38;break;
case 'jp':parts=[A('j',19,.92,1),A('p',48,.84,1)];w=68;break;
default:return{type,x:x+50,w:44,drone:1,y:{dl:15,dm:34,dh:56}[type],ph:rnd(0,TAU),sp:rnd(24,38)};
}
return{type,x,w,parts,h:Math.max(...parts.map((p)=>({p:33,t:44,j:66})[p.k]*p.sc)),col:parts.some((p)=>p.k==='j')?C.sil:C.or};
}
function pick(){
const pool=[['p',3]];
if(m>60)pool.push(['t',1.6]);
if(m>130)pool.push(['j',1.8]);
if(m>200)pool.push(['p2',1.8]);
if(m>250)pool.push(['dl',1.1],['dh',1.1]);
if(m>420)pool.push(['dm',1.5]);
if(m>560)pool.push(['p3',1.3],['jp',1]);
const sum=pool.reduce((a,b)=>a+b[1],0);
for(let n=0;n<6;n++){
let r=Math.random()*sum,t='p';
for(const[k,wt]of pool)if((r-=wt)<=0){t=k;break;}
if(!(hist[0]===t&&hist[1]===t)){hist.unshift(t);hist.length=2;return t;}
}
return 'p';
}
function spawn(type){
const o=make(type||pick(),nextAt),d=clamp(m/1600,0,1);
obs.push(o);
nextAt=o.x+o.w+v*rnd(lerp(1.25,.84,d),lerp(2,1.45,d))+(o.drone?60:0);
return o;
}
function joints(p,t){
const K=KIN[p.k],sc=p.sc,wg=rm()?0:1,pts=[];
let a=(K.a[0]+wg*2.5*Math.sin(t*1.1+p.ph))*D,x=0,y=11;
const rel=[0,K.a[1]+wg*5*Math.sin(t*1.5+p.ph*1.7),K.a[2]+wg*10*Math.sin(t*2+p.ph)];
pts.push([p.dx,y*sc]);
for(let i=0;i<3;i++){a+=rel[i]*D;x+=Math.cos(a)*K.l[i];y+=Math.sin(a)*K.l[i];pts.push([p.dx+p.f*x*sc,y*sc]);}
pts.a=a;return pts;
}
function jj(p,t){
const wg=rm()?0:1,a1=(60+wg*1.5*Math.sin(t*.7+p.ph))*D,a2=a1+50*D;
const S=[-8,19],E=[S[0]+Math.cos(a1)*34,S[1]+Math.sin(a1)*34],Wr=[E[0]+Math.cos(a2)*9,E[1]+Math.sin(a2)*9];
const q=(v)=>[p.dx+v[0]*p.sc,v[1]*p.sc];
return{S:q(S),E:q(E),W:q(Wr),ad:(100+wg*7*Math.sin(t*.9+p.ph))*D};
}
function shapes(o,ox){
const c=[],b=[];
const seg=(A,Bp,r)=>{const dx=Bp[0]-A[0],dy=Bp[1]-A[1],n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(r*1.2)));for(let i=0;i<=n;i++)c.push([ox+A[0]+dx*i/n,A[1]+dy*i/n,r]);};
if(o.drone){
const cx=ox+22,cy=o.y+(rm()?0:Math.sin(clock*3+o.ph)*1.2),ca=Math.cos(TILT),sa=Math.sin(TILT);
for(const[x,y,r]of[[-9.5,0,3],[-5,0,3.6],[1,0,3.8],[7,0,3.4],[-12,-7.4,2.2],[12,-7.4,2.2]])c.push([cx+x*ca-y*sa,cy-(x*sa+y*ca),r]);
return{c,b};
}
for(const p of o.parts){
const sc=p.sc;
if(p.k==='j'){
const J=jj(p,clock);
b.push([ox+p.dx-16*sc,ox+p.dx+16*sc,0,12*sc]);

else disc(p.x,p.y,p.r,`rgba(169,173,166,${.2 * k * k * dim})`);
}
}
function incoming(c){
for(const o of obs){
const ox=o.x-c;if(ox<W-2)continue;
const x=W-6,y0=o.drone?GY-o.y+5:GY-1,y1=o.drone?GY-o.y-11:GY-o.h,my=(y0+y1)/2;
g.globalAlpha=clamp(1.15-(ox-W)/Math.max(60,hz-W),.2,1)*.85;g.lineCap=g.lineJoin='round';
ln(x,y0,x,y1,o.drone?C.fg2:o.col,2.4);
g.strokeStyle=C.fg2;g.lineWidth=1.4;g.beginPath();g.moveTo(x-6,my-4);g.lineTo(x-10,my);g.lineTo(x-6,my+4);g.stroke();
if(o.drone)disc(x,y1-3,1.2,C.gr);
}
g.globalAlpha=1;
}
function draw(a){
const run=state==='run',c=run?pcam+(cam-pcam)*a:cam,y=run?pky+(ky-pky)*a:ky,dr=dist-(cam-c);
g.setTransform(dpr*s,0,0,dpr*s,0,0);
if(shake>0)g.translate(rnd(-1,1)*shake*7,rnd(-1,1)*shake*5);
drawSky(c);drawFar(c);drawGround(c,dr);
for(const o of obs)if(!o.drone){const ox=o.x-c;if(ox<W+30&&ox+o.w>-30)drawArms(o,ox);}
drawKart(kx,y,c);
for(const o of obs)if(o.drone){const ox=o.x-c;if(ox<W+40&&ox+o.w>-40)drawDrone(o,ox);}
drawFx();if(hz>W+41)incoming(c);
}
/* words */
const AGAIN=()=>(touch?'or tap anywhere':'or press <kbd>Space</kbd>');
const LEGEND=()=>(touch
?'Tap to jump, hold to go higher. Swipe down to duck.'
:'<kbd>Space</kbd> or <kbd>&uarr;</kbd> jump, hold to go higher<i>&middot;</i><kbd>&darr;</kbd> duck, or drop fast');
function setMsg(lead,sub,btn,keys){
leadEl.textContent=lead;leadEl.hidden=!lead;
subEl.innerHTML=sub;subEl.hidden=!sub;
goEl.textContent=btn;goEl.hidden=!btn;
keysEl.innerHTML=keys;keysEl.hidden=!keys;
msgEl.classList.add('in');void msgEl.offsetWidth;msgEl.classList.remove('in');
}
function hiText(){hiEl.classList.remove('lap');hiEl.textContent=best>0?`Best ${fmt(best)} m`:'';}
let shownM=-1,lapTimer=0;
function hud(){const mm=Math.floor(m);if(mm!==shownM){shownM=mm;mEl.textContent=fmt(mm);}}
function flash(){
flashAt=clock;
if(rm())return;
distEl.classList.add('flash');setTimeout(()=>distEl.classList.remove('flash'),160);
}
function lapToast(){
clearTimeout(lapTimer);
hiEl.classList.add('out');
lapTimer=setTimeout(()=>{
hiEl.textContent=`Lap ${lap + 1} · ${NAMES[lap % 4]}`;hiEl.classList.add('lap');hiEl.classList.remove('out');
lapTimer=setTimeout(()=>{hiEl.classList.add('out');lapTimer=setTimeout(()=>{hiText();hiEl.classList.remove('out');},500);},2600);
},500);
}
function ready(){
setBody('ready');
setMsg('Jump the robotic arms. Duck the interceptors.','Starring the electric kart our engineering club built.','Start',LEGEND());
}
/* the world board: a shared top 10, and one view beacon (the game never waits on either) */
const API='https://ethanshapero-api.ethanshapero.workers.dev',GAME='kart',SUFFIX=' m';
const lbEl=$('lb'),iniEl=$('ini');
const net=(path,o)=>{
const c=new AbortController(),t=setTimeout(()=>c.abort(),6000);
return fetch(API+path,Object.assign({signal:c.signal},o)).then((r)=>r.json()).finally(()=>clearTimeout(t));
};
(()=>{
if(navigator.doNotTrack==='1'||navigator.globalPrivacyControl===true)return;
let r='';
try{r=new URL(document.referrer).hostname;}catch(e){}
const b=JSON.stringify({t:'view',n:'play:'+GAME,p:(location.pathname+location.hash).slice(0,80),r:r===location.hostname?'':r,w:innerWidth});
try{if(navigator.sendBeacon(API+'/v1/e',b))return;}catch(e){}
fetch(API+'/v1/e',{method:'POST',body:b,keepalive:true,mode:'no-cors'}).catch(()=>{});
})();
let topP=null,lbRun=0,lbAsk=null,runAt=0;
const getTop=()=>topP||(topP=net('/v1/top?game='+GAME).then((d)=>(Array.isArray(d.top)?d.top:[]),(e)=>{topP=null;throw e;}));
const lastIni={
get(){try{return(localStorage.getItem('arcadeInitials')||'').slice(0,3);}catch(e){return '';}},
set(v){try{localStorage.setItem('arcadeInitials',v);}catch(e){}}
};
const cell=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e;};
function lbView(ask,top,me,msg){
const was=lbEl.classList.contains('on'),h0=lbEl.offsetHeight;
$('lb-ask').hidden=!ask;
$('lb-top').hidden=!(top&&top.length);
if(top)$('lb-ol').replaceChildren(...top.slice(0,10).map((r,j)=>{
const li=document.createElement('li');
if(j===me)li.className='me';
li.append(cell('span',j+1),cell('b',String(r.i||'').slice(0,3)),cell('span',fmt(+r.s||0)+SUFFIX));
return li;
}));
$('lb-m').textContent=msg||'';$('lb-m').hidden=!msg;
msgEl.classList.toggle('ask',!!ask);
const on=!!(ask||msg||(top&&top.length));
lbEl.classList.toggle('on',on);
const h1=lbEl.offsetHeight;
if(was&&on&&h0!==h1&&!rm()&&lbEl.animate)lbEl.animate({height:[h0+'px',h1+'px']},{duration:420,easing:'cubic-bezier(.16,1,.3,1)'});
}
const offline=(id)=>()=>{if(id===lbRun)lbView(false,null,-1,'Leaderboard offline');};
const board=(id,me,msg)=>(top)=>{if(id===lbRun)lbView(false,top,me,msg||(top.length?'':'No world scores yet.'));};
function lbOpen(sc,ms){
const id=++lbRun;
lbAsk=null;lbView();
getTop().then((top)=>{
if(id!==lbRun)return;
if(sc>0&&(top.length<10||sc>(+top[9].s||0))){
lbAsk={id,s:sc,ms};
iniEl.value=lastIni.get();iniDraw();
lbView(true);
}else board(id,-1)(top);
},offline(id));
}
function lbSend(){
const a=lbAsk,i=iniEl.value;
if(!a)return;
if(i.length<3){iniEl.focus();return;}
lastIni.set(i);lbAsk=null;iniEl.blur();
lbView(false,null,-1,'Saving…');
net('/v1/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:GAME,i,s:a.s,ms:a.ms,v:1})}).then((d)=>{
if(!d||!d.ok)return getTop().then(board(a.id,-1,'That score wasn’t saved.'));
topP=Array.isArray(d.top)?Promise.resolve(d.top):null;
return getTop().then((top)=>{
let me=top.findIndex((r,j)=>j===d.rank-1&&r.i===i&&+r.s===a.s);
if(me<0)me=top.findIndex((r)=>r.i===i&&+r.s===a.s);
board(a.id,me,me<0&&d.rank>10?`Your run is #${fmt(d.rank)} in the world.`:'')(top);
});
}).catch(offline(a.id));
}
function lbSkip(){
const a=lbAsk;
if(!a)return;
lbAsk=null;iniEl.blur();
getTop().then(board(a.id,-1),offline(a.id));
}
function lbClose(){lbRun++;lbAsk=null;if(document.activeElement===iniEl)iniEl.blur();lbEl.classList.remove('on');msgEl.classList.remove('ask');}
function iniDraw(){
const v=iniEl.value,f=document.activeElement===iniEl,all=f&&v.length>0&&iniEl.selectionStart===0&&iniEl.selectionEnd===v.length;
iniEl.parentNode.querySelectorAll('i').forEach((b,j)=>{b.textContent=v[j]||'';b.classList.toggle('on',f&&(all||j===Math.min(v.length,2)));});
$('lb-go').disabled=v.length<3;
}
iniEl.addEventListener('input',()=>{iniEl.value=iniEl.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);iniDraw();});
for(const ev of['focus','blur','select','keyup'])iniEl.addEventListener(ev,iniDraw);
iniEl.addEventListener('click',()=>{iniEl.select();iniDraw();});
$('lb-go').addEventListener('click',lbSend);
$('lb-x').addEventListener('click',lbSkip);
/* flow */
const setBody=(st)=>{B.className=st+(touch?' touch':'');};
function start(){
obs.length=0;fx.length=0;hist=[];
dist=m=runT=v=0;ky=pky=vy=0;air=cut=false;jbuf=0;susp=suspV=pitch=0;holdJ=false;
lastH=0;lap=0;nextAt=cam+W+300;pcam=cam;acc=0;
lbClose();runAt=performance.now();getTop().catch(()=>{});
clearTimeout(lapTimer);hiEl.classList.remove('out');hiText();
state='run';setBody('run');hud();setMsg('','','',LEGEND());goEl.blur();
}
function crash(o){
state='over';setBody('over');overAt=performance.now();holdJ=false;
shake=rm()?0:.32;
for(let i=0;i<12;i++)fx.push({x:kx+58+rnd(-6,6),y:GY-ky-rnd(6,26),vx:rnd(-120,140),vy:-rnd(120,300),r:rnd(1,2.2),l:0,L:rnd(.6,1.1),k:1});
for(let i=0;i<8;i++)dust(kx+rnd(30,64),GY-ky-rnd(0,20),rnd(-60,60),-rnd(10,50),rnd(1.5,3),rnd(.5,.9));
const mm=Math.floor(m),nb=mm>best;
if(nb){best=mm;store.set(best);}
lbOpen(mm,Math.round(performance.now()-runAt));
clearTimeout(lapTimer);hiEl.classList.remove('out');hiText();hud();
setMsg(o.drone?`Taken out by an interceptor at ${fmt(mm)} m`:`Crashed into a robotic arm at ${fmt(mm)} m`,
nb&&mm>0?`<em>New best</em> &middot; ${fmt(best)} m`:`Best ${fmt(best)} m`,'Run again',AGAIN());
}
function pause(){
if(state!=='run')return;
state='pause';setBody('pause');holdJ=false;duckK=false;duckP=0;duckS=0;setDuck();padEl.classList.remove('on');ptr.clear();
setMsg('Paused',`${fmt(m)} m so far`,'Keep going',AGAIN());
}
pzEl.addEventListener('click',(e)=>{e.preventDefault();pause();pzEl.blur();});
function resume(){state='run';setBody('run');acc=0;last=0;setMsg('','','',LEGEND());goEl.blur();}
function primary(){
const now=performance.now();
if(now-lastPrimary<250)return;
if(state==='over'&&now-overAt<450)return;
lastPrimary=now;
if(state==='ready'||state==='over')start();else if(state==='pause')resume();
}
/* input */
const JUMPK=['Space','ArrowUp','KeyW'],DUCKK=['ArrowDown','KeyS'];
addEventListener('keydown',(e)=>{
const k=e.code;
if(e.target===iniEl){if(k==='Enter'||k==='NumpadEnter'){e.preventDefault();lbSend();}else if(k==='Escape'){e.preventDefault();lbSkip();}return;}
if(e.target.closest&&e.target.closest('.lb')){if(k==='Escape')lbSkip();return;}
if(lbAsk&&state==='over'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
if(/^[a-z]$/i.test(e.key)){iniEl.focus();iniEl.select();return;}
if(k==='Escape'){lbSkip();return;}
if(k==='Enter'&&!(e.target instanceof HTMLButtonElement||e.target instanceof HTMLAnchorElement)){e.preventDefault();lbSend();return;}
}
if(JUMPK.includes(k)){e.preventDefault();if(e.repeat)return;state==='run'?jumpDown():primary();}
else if(DUCKK.includes(k)){e.preventDefault();duckK=true;setDuck();}
else if(k==='Enter'){if(state!=='run'&&!(e.target instanceof HTMLAnchorElement)){e.preventDefault();primary();}}
else if(k==='Escape'||k==='KeyP'){if(state==='run')pause();else if(state==='pause'&&k==='KeyP')resume();}
});
addEventListener('keyup',(e)=>{
if(JUMPK.includes(e.code))jumpUp();
else if(DUCKK.includes(e.code)){duckK=false;setDuck();}
});
const ptr=new Map();
document.addEventListener('pointerdown',(e)=>{
if(e.target.closest('a, .lb'))return;
if(e.pointerType==='touch'&&!touch){touch=true;B.classList.add('touch');keysEl.innerHTML=state==='run'?LEGEND():keysEl.innerHTML;requestAnimationFrame(resize);}
if(e.target.closest('button'))return;
e.preventDefault();
if(state!=='run'){primary();return;}
const z=e.pointerType!=='mouse'&&e.clientY>=padTop?'pad':'jump';
ptr.set(e.pointerId,{y:e.clientY,z,sw:false});
if(z==='pad'){duckP++;padEl.classList.add('on');setDuck();}else jumpDown();
});
document.addEventListener('pointermove',(e)=>{
const p=ptr.get(e.pointerId);
if(!p||p.sw||p.z==='pad'||e.pointerType==='mouse'||state!=='run')return;
if(e.clientY-p.y>14){p.sw=true;duckS++;jumpUp();setDuck();}
});
const up=(e)=>{
const p=ptr.get(e.pointerId);if(!p)return;ptr.delete(e.pointerId);
if(p.z==='pad'){duckP=Math.max(0,duckP-1);if(!duckP)padEl.classList.remove('on');}
else if(p.sw)duckS=Math.max(0,duckS-1);else jumpUp();
setDuck();
};
document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
document.addEventListener('contextmenu',(e)=>e.preventDefault());
goEl.addEventListener('click',primary);
/* loop: fixed 60 Hz steps, drawn every frame with interpolation */
let last=0,acc=0,raf=0;
function frame(now){
raf=requestAnimationFrame(frame);
let dt=last?(now-last)/1000:STEP;last=now;
const perf=T.perf;perf.push(dt*1000);if(perf.length>1200)perf.shift();
dt=Math.min(dt,.1);
if(state!=='pause')clock+=dt;
if(state==='run'){
acc+=dt*T.ff;
while(acc>=STEP){step(STEP);acc-=STEP;if(state!=='run')break;}
hud();
}else if(state==='over')stepFx(dt);
if(shake>0)shake=Math.max(0,shake-dt);
const tp=phaseOf(m);
pp+=(tp-pp)*(1-Math.exp(-dt*(Math.abs(tp-pp)>.5?1.6:5)));
P=palette(Math.max(0,pp));
draw(state==='run'?acc/STEP:1);
}
document.addEventListener('visibilitychange',()=>{
if(document.hidden){pause();cancelAnimationFrame(raf);raf=0;}
else if(!raf){last=0;raf=requestAnimationFrame(frame);}
});
addEventListener('blur',pause);
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(band);
if(document.fonts)document.fonts.ready.then(()=>draw(1));
Object.defineProperties(T,{kj:{get:()=>kj},hz:{get:()=>hz},W:{get:()=>W},state:{get:()=>state},m:{get:()=>m},best:{get:()=>best},obs:{get:()=>obs},kx:{get:()=>kx},v:{get:()=>v},cam:{get:()=>cam},air:{get:()=>air},vy:{get:()=>vy}});
Object.assign(T,{
setMeters(x){dist=x*UNIT;m=x;lastH=Math.floor(x/100);lap=Math.floor(x/LAP);pp=phaseOf(x);hud();},
spawn(t,sx){const o=make(t,cam+sx);obs.push(o);return o;},
clear(){obs.length=0;nextAt=cam+1e9;},
tick(n,fn){for(let i=0;i<n&&state==='run';i++){if(fn)fn();step(STEP);}},
jd:jumpDown,ju:jumpUp,dk(d){duckK=d;setDuck();},start
});
hiText();ready();resize();
raf=requestAnimationFrame(frame);
})();
</script>
