<html lang="en">

<style>
/* The hidden arcade: found through the last screen of ethanshapero.com */
:root {
  color-scheme: dark;
  --bg: #0B0C0B; --bg-2: #151715; --bg-3: #1E211E; --fg: #F1F2EE; --fg-2: #A9ADA6; --fg-3: #868B83; --green: #4FC08A;
  --font: "Hanken Grotesk", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --gutter: clamp(16px, 4vw, 56px);
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; min-height: 100svh; background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 4px; }
.back { position: absolute; left: var(--gutter); top: calc(12px + env(safe-area-inset-top, 0px)); padding: 10px 2px; font-size: 13px; font-weight: 500; color: var(--fg-3); text-decoration: none; transition: color .2s; }
.back:hover { color: var(--fg); }
main { max-width: 1000px; margin: 0 auto; padding: calc(clamp(88px, 16vh, 160px) + env(safe-area-inset-top, 0px)) var(--gutter) 64px; }
h1 { margin: 0; font-size: clamp(3.25rem, 1.4rem + 6vw, 6.5rem); font-weight: 760; line-height: .9; letter-spacing: -.045em; }
.wink { margin: 18px 0 0; max-width: 40ch; font-size: clamp(1.0625rem, 1rem + .4vw, 1.375rem); line-height: 1.4; letter-spacing: -.01em; color: var(--fg-2); }
.grid { list-style: none; margin: clamp(36px, 7vh, 72px) 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; }
.card {
  display: block; height: 100%; overflow: hidden; border-radius: 20px; text-decoration: none;
  background: var(--bg-2); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .07);
  transition: background-color .2s ease, transform .12s ease-out;
}
.card:hover { background: var(--bg-3); }
.card:active { transform: scale(.985); }
.card:focus-visible { border-radius: 20px; }
.art { position: relative; aspect-ratio: 16 / 10; overflow: hidden; }
.art svg { display: block; width: 100%; height: 100%; transition: transform .7s var(--ease-out); }
.card:hover .art svg { transform: scale(1.03); }
.txt { padding: 18px 20px 20px; }
h2 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; letter-spacing: -.025em; }
.arrow { width: 16px; height: 16px; color: var(--green); opacity: 0; transform: translateX(-4px); transition: opacity .2s ease, transform .2s var(--ease-out); }
.card:hover .arrow, .card:focus-visible .arrow { opacity: 1; transform: none; }
@media (hover: none) { .arrow { opacity: 1; transform: none; } }
.desc { margin: 6px 0 0; font-size: 15px; line-height: 1.45; color: var(--fg-2); }
.best { margin: 14px 0 0; font-size: 13px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.best b { font-weight: 600; color: var(--fg); }
.world { margin: 4px 0 0; min-height: 1.4em; font-size: 13px; color: var(--fg-3); font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .5s var(--ease-out); }
.world.on { opacity: 1; }
.world b { font-weight: 600; letter-spacing: .04em; color: var(--fg-2); }
@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise .9s var(--ease-out) both; }
  .grid li:nth-child(1) .rise { animation-delay: .08s; }
  .grid li:nth-child(2) .rise { animation-delay: .16s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .bob { animation: bob 4.5s ease-in-out infinite alternate; }
  .bob2 { animation: bob 3.2s ease-in-out -1s infinite alternate; }
  @keyframes bob { to { transform: translateY(-4px); } }
  .road { animation: road .8s linear infinite; }
  @keyframes road { to { transform: translateX(-40px); } }
}
</style>
</head>
<body>

<script>
// the shared leaderboards and visit counts (SPEC: Visit analytics)
const API = 'https://ethanshapero-api.ethanshapero.workers.dev';
// one view per load, unless Do Not Track or Global Privacy Control is on; no cookies, no storage
(() => {
  if (navigator.doNotTrack === '1' || navigator.globalPrivacyControl === true) return;
  let r = '';
  try { r = new URL(document.referrer).hostname; } catch (e) { /* no referrer */ }
  const body = JSON.stringify({ t: 'view', n: 'arcade', p: (location.pathname + location.hash).slice(0, 80), r: r === location.hostname ? '' : r, w: innerWidth });
  try { if (navigator.sendBeacon(API + '/v1/e', body)) return; } catch (e) { /* no beacon: fetch */ }
  fetch(API + '/v1/e', { method: 'POST', body, keepalive: true, mode: 'no-cors' }).catch(() => {});
})();
// each card's world best, from the game's top 10; if the board can't be reached the line stays empty
document.querySelectorAll('[data-world]').forEach((el) => {
  const c = new AbortController(), t = setTimeout(() => c.abort(), 6000);
  fetch(API + '/v1/top?game=' + el.dataset.world, { signal: c.signal }).then((r) => r.json()).then((d) => {
    const w = d && Array.isArray(d.top) ? d.top[0] : null, b = document.createElement('b');
    if (w) { b.textContent = String(w.i || '').slice(0, 3); el.append('World best: ', b, ' · ' + Math.round(+w.s || 0).toLocaleString('en-US') + el.dataset.unit); }
    else el.textContent = 'World best: no scores yet';
    el.classList.add('on');
  }).catch(() => {}).finally(() => clearTimeout(t));
});
// each game keeps its own best score in this browser
document.querySelectorAll('[data-best]').forEach((el) => {
  let v = 0;
  try { v = parseFloat(localStorage.getItem(el.dataset.best)) || 0; } catch (e) { /* storage blocked: nothing to show */ }
  if (v > 0) el.innerHTML = 'Best <b>' + Math.round(v).toLocaleString('en-US') + '</b>';
});
</script>
</body>
</html>
